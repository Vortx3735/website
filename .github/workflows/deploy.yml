name: Deploy to GitHub Pages

# Builds the site (including the programming notes at /docs/) and publishes it. Nothing deploys until a mentor sets the repository
# variable PAGES_ENABLED to "true" (Settings > Secrets and variables > Actions > Variables)
# and turns on GitHub Pages with "Source: GitHub Actions".
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: vars.PAGES_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Tells the build where Pages serves the site: vortx3735.github.io/website/
      # until a custom domain is set in Settings > Pages, then the domain root.
      - id: pages
        uses: actions/configure-pages@v5
      - run: npm run build
        env:
          SITE_ORIGIN: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
